spring:
  application:
    name: sistema-agendamentos

  datasource:
    url: jdbc:postgresql://localhost:5433/agendamentos
    username: ${DB_USERNAME:agendamentos}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080